# Font style metadata
name = "Geek"

# Serif headings (Source Serif 4, with Noto Serif SC for the Chinese name) over
# a sans body (Source Sans 3, its companion face). IBM Plex Mono for code.
#
# No `google_fonts` entry: the fonts are self-hosted (static/fonts/, declared in
# assets/scss/_site-fonts.scss) so they are known at first paint and text never
# shows in a fallback face first.

# Font families
heading_font = "Source Serif 4"
body_font = "Source Sans 3"
nav_font = "Source Sans 3"
mono_font = "IBM Plex Mono"
