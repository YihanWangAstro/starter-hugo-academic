# Font style metadata
name = "Geek"

# Serif throughout, after nsfc.gov.cn (which sets headings and lists in
# Source Han Serif / Song). Source Serif 4 is the Latin companion of Source
# Han Serif; Noto Serif SC is the same design as Source Han Serif SC and
# covers the Chinese name. IBM Plex Mono retained for code and ASCII trees.
google_fonts = "family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500"

# Font families
heading_font = "Source Serif 4"
body_font = "Source Serif 4"
nav_font = "Source Serif 4"
mono_font = "IBM Plex Mono"
