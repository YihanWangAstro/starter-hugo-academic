# Theme metadata
name = "Geek"

# Institutional blue + muted gold on white, after nsfc.gov.cn.
# The site is light-only (forced in layouts/partials/custom_head.html).

[light]
  primary = "#1f4e83"
  background = "#ffffff"

  # Menu — solid blue bar, white links
  menu_primary = "#1f4e83"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  home_section_odd = "#ffffff"
  home_section_even = "#ffffff"

[dark]
  # Unused (light-only site); kept in step with the light palette.
  primary = "#5f9ccc"
  link = "#5f9ccc"
  link_hover = "#b6cee3"
  menu_primary = "#0a3a6a"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"
  background = "#0b1f38"
  home_section_odd = "#0b1f38"
  home_section_even = "#0b1f38"
